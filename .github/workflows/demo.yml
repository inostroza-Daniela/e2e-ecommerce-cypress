name: Demo Recording

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build test image
        run: docker build -t e2e-ecommerce-cypress .

      - name: Record purchase scenario
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/cypress/results:/e2e/cypress/results" \
            e2e-ecommerce-cypress \
            --browser chrome \
            --spec cypress/e2e/features/checkout.feature \
            --expose "tags=@e2e" \
            --config "video=true,videosFolder=cypress/results/videos,retries=0"

      - name: Convert recording to GIF
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          video=$(find cypress/results/videos -name '*.mp4' | head -n 1)
          mkdir -p docs
          ffmpeg -y -loglevel error -i "$video" \
            -vf "setpts=1.6*PTS,fps=12,scale=1100:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4" \
            docs/demo.gif
          ls -lh docs/demo.gif

      - name: Commit demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          if git diff --cached --quiet; then
            echo "Demo is up to date"
          else
            git commit -m "Update demo recording"
            git push
          fi
