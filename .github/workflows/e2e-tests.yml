name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: Cucumber tag expression to filter scenarios (e.g. @smoke)
        required: false
        default: ''
      update_snapshots:
        description: Regenerate visual baselines and commit them to the repository
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Lint
        run: npm run lint

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build test image
        run: docker build -t e2e-ecommerce-cypress .

      - name: Run E2E suite
        env:
          TAGS: ${{ inputs.tags }}
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            EXPOSE="updateSnapshots=true,tags=@visual"
          else
            EXPOSE="requireSnapshots=true"
            if [ -n "$TAGS" ]; then EXPOSE="$EXPOSE,tags=$TAGS"; fi
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE/cypress/results:/e2e/cypress/results" \
            -v "$GITHUB_WORKSPACE/cypress/snapshots:/e2e/cypress/snapshots" \
            e2e-ecommerce-cypress \
            --browser chrome --expose "$EXPOSE"

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mochawesome-report
          path: cypress/results/report
          if-no-files-found: ignore
          retention-days: 14

      - name: Package report for GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: cypress/results/report

      - name: Commit visual baselines
        if: inputs.update_snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cypress/snapshots
          if git diff --cached --quiet; then
            echo "Visual baselines are up to date"
          else
            git commit -m "Update visual baselines"
            git push
          fi

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-evidence
          path: |
            cypress/results/screenshots
            cypress/results/snapshot-diffs
          if-no-files-found: ignore
          retention-days: 14

  publish-report:
    needs: e2e
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.e2e.result == 'success' || needs.e2e.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
